name: list-models
# Manual run: Actions tab > list-models > Run workflow. Prints the model ids your key can call.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  models:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: make setup
      - run: uv run tbv models --contains gemma
      - run: uv run tbv models --contains flash-lite
