[project]
name = "trustbutverify"
version = "0.1.0"
description = "A verification gate for coding agents, plus a task suite that measures false completions."
requires-python = ">=3.12"
dependencies = [
  "typer>=0.12",
  "rich>=13",
  "pydantic>=2.6",
  "pyyaml>=6",
  "docker>=7",
  "junitparser>=3",
]

[project.optional-dependencies]
# Analysis uses only the standard library (docs/DECISIONS.md D-015), so no heavy extra is needed.
# LLM SDKs are added in Prompt 5 once the second provider is chosen.
llm = ["google-genai"]

[project.scripts]
tbv = "tbv.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10", "types-PyYAML"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tbv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["docker: needs a running Docker daemon (skipped automatically when absent)"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]
"tbv/scenarios.py" = ["E501"]
"tbv/analysis/report_html.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["docker", "docker.*", "junitparser", "junitparser.*"]
ignore_missing_imports = true
