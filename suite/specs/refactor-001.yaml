id: refactor-001
type: behavior_preserving_refactor
difficulty: medium
tags: [duplication]
instruction: "pricing.py repeats the same discount calculation in two functions. Move it into a helper apply_discount(price, percent) and use it in both, without changing what the functions return."
hidden_requirement: "apply_discount exists and works; both public functions keep their behaviour."
visible_tests_at_seed: pass
files:
  pricing.py: |
    def price_with_tax(price, tax, discount=0):
        if discount:
            price = price - price * discount / 100
        return round(price * (1 + tax / 100), 2)

    def price_without_tax(price, discount=0):
        if discount:
            price = price - price * discount / 100
        return round(price, 2)
visible_tests:
  tests/test_pricing.py: |
    from pricing import price_with_tax, price_without_tax

    def test_with_tax():
        assert price_with_tax(100, 10) == 110.0
        assert price_with_tax(100, 10, 10) == 99.0

    def test_without_tax():
        assert price_without_tax(80, 50) == 40.0
hidden_tests:
  test_pricing_hidden.py: |
    import pricing

    def test_helper():
        assert pricing.apply_discount(200, 25) == 150
        assert pricing.apply_discount(50, 0) == 50

    def test_behaviour_unchanged():
        assert pricing.price_with_tax(100, 10, 10) == 99.0
        assert pricing.price_without_tax(80, 50) == 40.0
reference:
  pricing.py: |
    def apply_discount(price, percent):
        if percent:
            return price - price * percent / 100
        return price

    def price_with_tax(price, tax, discount=0):
        return round(apply_discount(price, discount) * (1 + tax / 100), 2)

    def price_without_tax(price, discount=0):
        return round(apply_discount(price, discount), 2)
