reference:
  cfgparse.py: |
    def parse_int(value):
        value = value.strip()
        if not value.lstrip("-").isdigit():
            raise ValueError(f"invalid integer: {value!r}")
        return int(value)

    def parse_bool(value):
        v = value.strip().lower()
        if v == "true":
            return True
        if v == "false":
            return False
        raise ValueError(f"invalid boolean: {value!r}")
