reference:
  mathx.py: |
    import math

    def safe_sqrt(x):
        """Square root, or None when x is negative (never raises)."""
        if x < 0:
            return None
        return math.sqrt(x)

    def safe_divide(a, b):
        if b == 0:
            return None
        return a / b
