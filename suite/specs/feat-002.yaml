    import pytest
    from chunks import chunk

    def test_remainder():
        assert chunk([1, 2, 3], 2) == [[1, 2], [3]]

    def test_edges():
        assert chunk([], 3) == []
        assert chunk([1], 5) == [[1]]

    def test_invalid_size():
        with pytest.raises(ValueError):
