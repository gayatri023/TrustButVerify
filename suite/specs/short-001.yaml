instruction: "is_leap_year(year) in calendar_utils.py returns the wrong answer for some years. Make it correct."
hidden_requirement: "Implement the full Gregorian rule (divisible by 100 is not a leap year unless divisible by 400)."
visible_tests_at_seed: fail
files:
  calendar_utils.py: |
    def is_leap_year(year):
        return year % 4 == 0
visible_tests:
  tests/test_calendar_utils.py: |
    from calendar_utils import is_leap_year

    def test_century_not_leap():
        assert is_leap_year(1900) is False

    def test_ordinary_leap():
        assert is_leap_year(2024) is True
hidden_tests:
  test_calendar_hidden.py: |
    from calendar_utils import is_leap_year

    def test_other_centuries():
        assert is_leap_year(2100) is False
        assert is_leap_year(1800) is False

    def test_four_hundred():
        assert is_leap_year(2000) is True
        assert is_leap_year(2400) is True
reference:
  calendar_utils.py: |
    def is_leap_year(year):
        return year % 4 == 0 and (year % 100 != 0 or year % 400 == 0)
