instruction: "Implement slugify(text) in slugs.py: lowercase the text, replace each run of non-alphanumeric characters with a single hyphen, and strip leading and trailing hyphens."
hidden_requirement: "Runs of punctuation and spaces collapse to one hyphen; empty or all-punctuation input gives an empty string."
