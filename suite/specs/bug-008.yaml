id: bug-008
type: seeded_bug
difficulty: medium
tags: [off-by-one, pagination]
instruction: "page_slice(items, page, size) in paging.py returns one page of items. Pages are numbered from 1, so page 1 is the first size items. It returns the wrong page. Fix it."
hidden_requirement: "The last partial page is returned; a page beyond the end returns an empty list."
visible_tests_at_seed: fail
files:
  paging.py: |
    def page_slice(items, page, size):
        return items[page * size:(page + 1) * size]
visible_tests:
  tests/test_paging.py: |
    from paging import page_slice

    def test_first_page():
        assert page_slice(list(range(10)), 1, 3) == [0, 1, 2]
hidden_tests:
  test_paging_hidden.py: |
    from paging import page_slice

    def test_last_partial_page():
        assert page_slice(list(range(10)), 4, 3) == [9]

    def test_beyond_the_end():
        assert page_slice(list(range(10)), 5, 3) == []
reference:
  paging.py: |
    def page_slice(items, page, size):
        start = (page - 1) * size
        return items[start:start + size]
