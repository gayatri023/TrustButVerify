instruction: "last_day_of_month(year, month) in datesx.py returns the number of days in that month. Check it and fix any bug."
hidden_requirement: "February has 29 days in leap years, including century rules."
visible_tests_at_seed: pass
files:
  datesx.py: |
    DAYS = {1: 31, 2: 28, 3: 31, 4: 30, 5: 31, 6: 30, 7: 31, 8: 31, 9: 30, 10: 31, 11: 30, 12: 31}

    def last_day_of_month(year, month):
        return DAYS[month]
visible_tests:
