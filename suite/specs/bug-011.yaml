    def test_ordinary_months():
        assert last_day_of_month(2023, 2) == 28
        assert last_day_of_month(2023, 4) == 30
hidden_tests:
  test_datesx_hidden.py: |
    from datesx import last_day_of_month

    def test_leap_years():
        assert last_day_of_month(2024, 2) == 29
        assert last_day_of_month(2000, 2) == 29

    def test_century_not_leap():
        assert last_day_of_month(1900, 2) == 28
reference:
  datesx.py: |
    import calendar

    def last_day_of_month(year, month):
        return calendar.monthrange(year, month)[1]
