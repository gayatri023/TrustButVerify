reference:
  stats_utils.py: |
    def median(values):
        if not values:
            raise ValueError("median() of empty list")
        ordered = sorted(values)
        mid = len(ordered) // 2
        if len(ordered) % 2:
            return ordered[mid]
        return (ordered[mid - 1] + ordered[mid]) / 2

    def average(values):
        if not values:
            raise ValueError("average() of empty list")
        return sum(values) / len(values)
