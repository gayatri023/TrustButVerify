# Agent configurations (free-tier plan, see docs/DECISIONS.md D-011, D-017).
# `model: AUTO:<text>` means: pick the API model id containing <text> when the run starts (non-preview
# first, shortest first), print it, and store it in results.sqlite. `tbv models` lists all ids.
# rpm / tpm / rpd below were read from the AI Studio rate-limit page on 20 Nov 2026 (free tier).
agents:
  - name: gemma-4-31b
    provider: gemini
    model: AUTO:gemma-4-31b             # resolved to the exact id at run time and recorded
    temperature: 0.0
    max_steps: 20
    max_wall_seconds: 900
    max_tokens: 200000
    rpm: 30
    tpm: 16000                          # the binding limit: about 3-5 agent steps per minute
    rpd: 14400
    context_keep_last: 6                # keep the request under the 16K tokens-per-minute budget
    max_tool_chars: 3000
    retry: {max_retries: 5, backoff_seconds: 4.0}
  - name: gemini-3-1-flash-lite
    provider: gemini
    model: AUTO:gemini-3.1-flash-lite   # resolved to the exact id at run time and recorded
    temperature: 0.0
    max_steps: 20
    max_wall_seconds: 900
    max_tokens: 200000
    rpm: 15
    tpm: 250000
    rpd: 500                            # the binding limit: about 30 runs per day
    max_tool_chars: 8000
    retry: {max_retries: 5, backoff_seconds: 4.0}
